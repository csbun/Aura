# Optional Immich profile. Start with:
# docker compose -f docker-compose.yml -f docker-compose.immich.yml --profile immich up -d --build
#
# The service layout follows the official Immich Docker Compose release. Keep
# IMMICH_VERSION pinned after the first successful installation.
services:
  aura:
    volumes:
      - nas_photos:/photos:ro

  aura-scan:
    volumes:
      - nas_photos:/photos:ro

  aura-worker:
    volumes:
      - nas_photos:/photos:ro

  immich-server:
    profiles: ["immich"]
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-./immich/library}:/data
      - nas_photos:/photos:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_PORT: 5432
      DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: redis
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    profiles: ["immich"]
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - immich_model_cache:/cache
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    restart: always

  redis:
    profiles: ["immich"]
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    restart: always

  database:
    profiles: ["immich"]
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${IMMICH_DB_DATA_LOCATION:-./immich/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  nas_photos:
    driver: local
    driver_opts:
      type: cifs
      device: "//${NAS_HOST:?set NAS_HOST}/${NAS_SHARE:?set NAS_SHARE}"
      o: "addr=${NAS_HOST:?set NAS_HOST},username=${NAS_USER:?set NAS_USER},password=${NAS_PASSWORD:?set NAS_PASSWORD},ro,vers=${NAS_SMB_VERSION:-3.0},sec=ntlmssp,iocharset=utf8"
  immich_model_cache:
