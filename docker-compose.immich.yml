# Immich v3.3.5: server, machine learning, Redis, PostgreSQL and Chinese
# reverse-geocoding data in one file.
#
# Start with:
#   docker compose -f docker-compose.immich.yml up -d
#
# External libraries are host directories. Set one or more of these in .env:
#   IMMICH_EXTERNAL_LIBRARY_1=/srv/photos
#   IMMICH_EXTERNAL_LIBRARY_2=/mnt/archive
# They appear in Immich as /external/1 and /external/2.
services:
  geodata-init:
    image: alpine:3.21
    working_dir: /app
    volumes:
      - type: bind
        source: ./scripts
        target: /app/scripts
        read_only: true
      - type: bind
        source: ./immich/geodata-cn
        target: /app/immich/geodata-cn
    environment:
      IMMICH_GEODATA_CN_RELEASE: ${IMMICH_GEODATA_CN_RELEASE:-auto-release}
      IMMICH_GEODATA_CN_GITHUB_PROXY: ${IMMICH_GEODATA_CN_GITHUB_PROXY:-https://gh-proxy.com/}
      IMMICH_GEODATA_CN_FORCE: ${IMMICH_GEODATA_CN_FORCE:-0}
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - >-
        if [ "${IMMICH_GEODATA_CN_FORCE:-0}" != "1" ] &&
        [ -f /app/immich/geodata-cn/geodata/geodata-date.txt ] &&
        [ -d /app/immich/geodata-cn/i18n-iso-countries/langs ]; then
        echo "Immich Chinese geodata is already present; skipping download";
        exit 0;
        fi;
        apk add --no-cache bash curl unzip;
        bash scripts/prepare_immich_geodata_cn.sh

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.5}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-./immich/library}:/data
      - type: bind
        source: ${IMMICH_EXTERNAL_LIBRARY_1:-./external-library-1}
        target: /external/1
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${IMMICH_EXTERNAL_LIBRARY_2:-./external-library-2}
        target: /external/2
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${IMMICH_EXTERNAL_LIBRARY_3:-./external-library-3}
        target: /external/3
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${IMMICH_EXTERNAL_LIBRARY_4:-./external-library-4}
        target: /external/4
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ./immich/geodata-cn/geodata
        target: /build/geodata
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./immich/geodata-cn/i18n-iso-countries/langs
        target: /usr/src/app/server/node_modules/i18n-iso-countries/langs
        read_only: true
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOSTNAME: database
      DB_PORT: 5432
      DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: redis
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_started
      geodata-init:
        condition: service_completed_successfully
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.5}
    volumes:
      - immich_model_cache:/cache
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
      MACHINE_LEARNING_MODEL_TTL: 300
      MACHINE_LEARNING_WORKERS: 1
      HF_ENDPOINT: ${IMMICH_ML_HF_ENDPOINT:-https://huggingface.co}
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${IMMICH_DB_DATA_LOCATION:-./immich/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  immich_model_cache:
