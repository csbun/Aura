# Immich v3.3.5: server, machine learning, Redis, PostgreSQL and Chinese
# reverse-geocoding data in one file.
#
# Start with:
#   docker compose -f docker-compose.immich.yml up -d
#
# External libraries are host directories. Set one or more of these in .env:
#   IMMICH_EXTERNAL_LIBRARY_1=/srv/photos
#   IMMICH_EXTERNAL_LIBRARY_2=/mnt/archive
# They appear in Immich as /external/1 and /external/2.
services:
  geodata-init:
    image: ${IMMICH_GEODATA_INIT_IMAGE:-alpine:3.21}
    working_dir: /app
    volumes:
      - immich_geodata:/geodata
      - immich_country_langs:/langs
    environment:
      IMMICH_GEODATA_CN_RELEASE: ${IMMICH_GEODATA_CN_RELEASE:-auto-release}
      IMMICH_GEODATA_CN_GITHUB_PROXY: ${IMMICH_GEODATA_CN_GITHUB_PROXY:-https://gh-proxy.com/}
      IMMICH_GEODATA_CN_FORCE: ${IMMICH_GEODATA_CN_FORCE:-0}
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        complete() {
          for file in geodata-date.txt cities500.txt countryInfo.txt admin1CodesASCII.txt admin2Codes.txt ne_10m_admin_0_countries.geojson; do
            [ -s "$$1/$$file" ] || return 1
          done
          [ -s "$$2/zh.json" ]
        }
        if [ "$$IMMICH_GEODATA_CN_FORCE" != "1" ] &&
          [ -s /geodata/.immich-geodata-cn.complete ] && complete /geodata /langs; then
          echo "Immich Chinese geodata is already present; skipping download."
          exit 0
        fi
        apk add --no-cache curl unzip
        direct_url="https://github.com/ZingLix/immich-geodata-cn/releases/download/$$IMMICH_GEODATA_CN_RELEASE"
        if [ "$$IMMICH_GEODATA_CN_GITHUB_PROXY" = direct ]; then
          base_url="$$direct_url"
        else
          base_url="$${IMMICH_GEODATA_CN_GITHUB_PROXY%/}/$$direct_url"
        fi
        stage=$$(mktemp -d)
        trap 'rm -rf "$$stage"' EXIT
        for asset in geodata_admin_2_admin_3_full.zip i18n-iso-countries.zip; do
          curl --fail --http1.1 --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --max-time 0 --speed-limit 256 --speed-time 180 \
            --output "$$stage/$$asset" "$$base_url/$$asset"
          unzip -q "$$stage/$$asset" -d "$$stage"
        done
        complete "$$stage/geodata" "$$stage/i18n-iso-countries/langs" || { echo "Downloaded geodata is incomplete." >&2; exit 1; }
        # Copy into the volume roots; never remove a mounted directory.
        # Publish the completion marker last so interrupted copies retry.
        rm -f /geodata/.immich-geodata-cn.complete
        cp -R "$$stage/i18n-iso-countries/langs/." /langs/
        for file in cities500.txt countryInfo.txt admin1CodesASCII.txt admin2Codes.txt ne_10m_admin_0_countries.geojson; do
          cp "$$stage/geodata/$$file" "/geodata/$$file"
        done
        cp "$$stage/geodata/geodata-date.txt" /geodata/geodata-date.txt
        printf '%s\n' "$$IMMICH_GEODATA_CN_RELEASE" > /geodata/.immich-geodata-cn.complete
        echo "Installed Immich Chinese geodata."

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.5}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-immich_library}:/data
      - ${IMMICH_EXTERNAL_LIBRARY_1:-immich_empty_library}:/external/1:ro
      - ${IMMICH_EXTERNAL_LIBRARY_2:-immich_empty_library}:/external/2:ro
      - ${IMMICH_EXTERNAL_LIBRARY_3:-immich_empty_library}:/external/3:ro
      - ${IMMICH_EXTERNAL_LIBRARY_4:-immich_empty_library}:/external/4:ro
      - type: volume
        source: immich_geodata
        target: /build/geodata
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: immich_country_langs
        target: /usr/src/app/server/node_modules/i18n-iso-countries/langs
        read_only: true
        volume:
          nocopy: true
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOSTNAME: database
      DB_PORT: 5432
      DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: redis
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_started
      geodata-init:
        condition: service_completed_successfully
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.5}
    volumes:
      - immich_model_cache:/cache
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
      MACHINE_LEARNING_MODEL_TTL: 300
      MACHINE_LEARNING_WORKERS: 1
      HF_ENDPOINT: ${IMMICH_ML_HF_ENDPOINT:-https://huggingface.co}
    restart: always

  redis:
    container_name: immich_redis
    image: ${IMMICH_REDIS_IMAGE:-valkey/valkey:9}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${IMMICH_DB_DATA_LOCATION:-immich_postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  immich_library:
  immich_postgres:
  immich_geodata:
  immich_country_langs:
  immich_empty_library:
  immich_model_cache:
