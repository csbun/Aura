x-aura-environment: &aura-environment
  AURA_DB_PATH: /data/aura.db
  AURA_EVENT_TAGS_ENABLED: ${AURA_EVENT_TAGS_ENABLED:-true}
  AURA_EVENT_INTERVAL: ${AURA_EVENT_INTERVAL:-86400}
  AURA_ALBUM_INTERVAL: ${AURA_ALBUM_INTERVAL:-300}
  IMMICH_URL: ${IMMICH_URL:-}
  IMMICH_API_KEY: ${IMMICH_API_KEY:-}
  IMMICH_JOB_API_KEY: ${IMMICH_JOB_API_KEY:-}
  IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL:-}
  IMMICH_PORT: ${IMMICH_PORT:-2283}

services:
  aura:
    build: .
    restart: unless-stopped
    environment: *aura-environment
    ports:
      - "${AURA_PORT:-18080}:8080"
    volumes:
      - "${AURA_DATA_DIR:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp

  aura-worker:
    build: .
    restart: unless-stopped
    environment: *aura-environment
    volumes:
      - "${AURA_DATA_DIR:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp
    command: ["aura-worker"]
