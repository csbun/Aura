# Optional writable SAMPLE directory for testing Immich XMP persistence.
# This grants write access to sample photos as well as XMP files.
# Not enabled by the normal samples configuration; NAS stays read-only.
services:
  immich-server:
    volumes:
      - type: bind
        source: ./sample-photos
        target: /samples
        read_only: false
        bind:
          create_host_path: false
